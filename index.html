<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lenkki- ja punttisaldojen laskuri">
<meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Saldo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* base reset (the artifact viewer provided this) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Saldolaskuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column — balance panel with two vertical bars (ceiling line + compressed overflow zone) on top, two slider cards stacked below, hold-to-redeem button last */
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#15212c; --muted:#5b6977; --line:#d6dce2; --track:#e3e8ec;
  --run:#0b7a66; --run-soft:#d3ece6;
  --lift:#c2531b; --lift-soft:#f5e0d3;
  --gold:#a87c0c; --gold-soft:#f3e7c2;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(21,33,44,.06),0 6px 20px -8px rgba(21,33,44,.14);
  --font-display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar-h:210px; --cap-at:70%; --over-zone:30%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#172029; --ink:#e7edf2; --muted:#92a0ad; --line:#283440; --track:#24303b;
    --run:#3cc6aa; --run-soft:#143832;
    --lift:#f28c52; --lift-soft:#3b2416;
    --gold:#f0c24b; --gold-soft:#3a3015;
    --on-accent:#0e141a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#172029; --ink:#e7edf2; --muted:#92a0ad; --line:#283440; --track:#24303b;
  --run:#3cc6aa; --run-soft:#143832;
  --lift:#f28c52; --lift-soft:#3b2416;
  --gold:#f0c24b; --gold-soft:#3a3015;
  --on-accent:#0e141a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px;display:flex;flex-direction:column;gap:12px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:2px}
h1{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:.9;letter-spacing:.01em;margin:0;text-transform:uppercase}
.tally{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tally-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tally-num{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* ---------- balance panel ---------- */
.panel{padding:14px 14px 16px;overflow:hidden;transition:border-color .4s,box-shadow .4s}
.panel.both{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),var(--shadow)}
.panel::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,var(--gold-soft) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;opacity:0;pointer-events:none}
.panel.celebrate::before{animation:sweep 1.3s ease-out}
@keyframes sweep{0%{opacity:1;background-position:150% 0}100%{opacity:1;background-position:-60% 0}}
.banner{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--on-accent);font-weight:700;font-size:13px;letter-spacing:.02em;border-radius:10px;padding:7px 10px;margin-bottom:12px;text-align:center}
.banner.enter{animation:drop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{opacity:0;transform:translateY(-14px) scale(.96)}100%{opacity:1;transform:none}}

.cols{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0}
.col{--c:var(--run);--c-soft:var(--run-soft);display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 6px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.col-head{display:flex;align-items:center;gap:7px;min-height:22px}
.col-head .name{font-weight:700;font-size:15px}
.badge{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--c);color:var(--on-accent);padding:2px 7px;border-radius:99px}
.col-num{display:flex;align-items:baseline;gap:5px}
.num{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;display:inline-block}
.num.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.1);color:var(--c)}100%{transform:scale(1)}}
.of{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.bar{position:relative;width:100%;height:var(--bar-h);margin-top:4px}
.track{position:absolute;left:50%;transform:translateX(-50%);width:62%;max-width:92px;top:0;bottom:0;border-radius:14px;overflow:hidden;background:var(--track)}
.zone{position:absolute;left:0;right:0}
.zone-base{bottom:0;height:var(--cap-at)}
.zone-over{top:0;height:var(--over-zone);background:repeating-linear-gradient(-45deg,var(--surface) 0 5px,transparent 5px 10px);opacity:.9}
.fill-base,.fill-over{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.fill-base{background:var(--c)}
.zone-base::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 calc(var(--seg) - 2px),var(--surface) calc(var(--seg) - 2px) var(--seg));pointer-events:none}
.fill-over{background:repeating-linear-gradient(-45deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 55%,var(--surface)) 6px 12px)}
.col.full .fill-base{background-image:linear-gradient(to top,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);background-size:100% 220%;animation:rise-shine 2.6s linear infinite}
@keyframes rise-shine{from{background-position:0 -120%}to{background-position:0 220%}}
.track::after{content:"";position:absolute;inset:0;background:var(--surface);opacity:0;pointer-events:none}
.col.hit .track::after{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.ceiling{position:absolute;left:0;right:0;bottom:var(--cap-at);height:0;border-top:2px dashed var(--muted);opacity:.7;transition:border-color .3s,opacity .3s}
.ceiling span{position:absolute;right:0;bottom:3px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:0 3px;border-radius:4px;white-space:nowrap}
.col.full .ceiling{border-top-style:solid;border-color:var(--c);opacity:1}
.col.full .ceiling span{color:var(--c)}
.col.hit .ceiling{animation:ceil .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes ceil{0%{box-shadow:0 0 0 0 var(--c)}30%{box-shadow:0 0 14px 4px var(--c);transform:scaleX(1.06)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.pop{position:absolute;left:50%;bottom:calc(var(--cap-at) + 10px);transform:translateX(-50%);font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);pointer-events:none;opacity:0;white-space:nowrap;text-shadow:0 2px 0 var(--surface)}
.col.hit .pop{animation:pop 1.5s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}35%{transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-16px)}}
.chip{position:absolute;left:50%;font-weight:700;font-size:14px;color:var(--c);pointer-events:none;white-space:nowrap;animation:chip 1.1s ease-out forwards;text-shadow:0 1px 0 var(--surface)}
@keyframes chip{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
.col-status{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;min-height:18px}
.col-status b{color:var(--c)}

/* ---------- sliders ---------- */
.adder{--c:var(--run);--c-soft:var(--run-soft);padding:14px 14px 14px;display:flex;flex-direction:column;gap:4px}
.adder-top{display:flex;align-items:center;gap:8px}
.adder-top label{font-weight:700;font-size:15px}
.adder-top output{margin-left:auto;font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;background:transparent;margin:0;--pct:25%;touch-action:pan-y}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--c) var(--pct),var(--track) var(--pct))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid var(--c);margin-top:-11px;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--c-soft)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--c) var(--pct),var(--track) var(--pct))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px;margin-top:-6px}
.adder-actions{display:flex;gap:8px;margin-top:8px}
.step{appearance:none;width:48px;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font:inherit;font-size:22px;font-weight:600;line-height:1;cursor:pointer;touch-action:manipulation}
.step:active{background:var(--c-soft)}
.add{appearance:none;flex:1;border:0;border-radius:12px;background:var(--c);color:var(--on-accent);font:inherit;font-weight:700;font-size:16px;padding:13px 12px;cursor:pointer;transition:transform .12s,opacity .2s;touch-action:manipulation}
.add:active{transform:scale(.97)}
.add:disabled{opacity:.4;cursor:not-allowed}
.add:focus-visible,.step:focus-visible,.redeem:focus-visible,.link-btn:focus-visible,.toast button:focus-visible{outline:3px solid var(--c,var(--gold));outline-offset:2px}

/* ---------- redeem ---------- */
.redeem-box{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.redeem{position:relative;overflow:hidden;appearance:none;border:0;border-radius:16px;padding:18px 16px;font:inherit;cursor:pointer;background:var(--track);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;--p:0}
.redeem .big{position:relative;font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.redeem .small{position:relative;font-size:12px;font-weight:600;letter-spacing:.03em}
.redeem::before{content:"";position:absolute;inset:0;width:calc(var(--p) * 100%);background:rgba(255,255,255,.3)}
.redeem:disabled{cursor:not-allowed}
.redeem.ready{background:var(--gold);color:var(--on-accent);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--gold-soft)}50%{box-shadow:0 0 0 8px var(--gold-soft)}}
.redeem.ready.appear{animation:appear .6s cubic-bezier(.3,1.6,.5,1),breathe 2.2s ease-in-out .6s infinite}
@keyframes appear{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.redeem-note{font-size:13px;color:var(--muted);text-align:center;margin:0;text-wrap:balance}

footer{display:flex;justify-content:center;margin-top:14px}
.link-btn{appearance:none;background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.link-btn.armed{color:var(--lift);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:5}
.toast.show{transform:translate(-50%,0)}
.toast span{font-size:14px;font-weight:600;min-width:0}
.toast button{appearance:none;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;flex:none}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

@media (max-width:360px){.num{font-size:40px}:root{--bar-h:190px}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1>Saldo&shy;laskuri</h1>
    <div class="tally"><span class="tally-label">Lunastettu</span><span class="tally-num" id="tally">0×</span></div>
  </header>

  <section class="card panel" id="panel" aria-label="Saldot">
    <div class="banner" id="banner" hidden>Molemmat katot täynnä. Lunastus on auki.</div>
    <div class="cols" id="cols"></div>
  </section>

  <div id="adders" style="display:flex;flex-direction:column;gap:12px"></div>

  <div class="redeem-box">
    <button class="redeem" id="redeem" type="button" disabled>
      <span class="big">Lunasta</span>
      <span class="small" id="redeem-small">Täytä molemmat saldot</span>
    </button>
    <p class="redeem-note" id="redeem-note"></p>
  </div>

  <footer><button class="link-btn" id="reset" type="button">Nollaa kaikki saldot</button></footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="undo">Kumoa</button></div>

<template id="col-tpl">
  <div class="col">
    <div class="col-head"><span class="dot"></span><span class="name"></span><span class="badge" hidden>Täynnä</span></div>
    <div class="col-num"><span class="num">0:00</span><span class="of"></span></div>
    <div class="bar">
      <div class="track">
        <div class="zone zone-over"><div class="fill-over"></div></div>
        <div class="zone zone-base"><div class="fill-base"></div></div>
      </div>
      <div class="ceiling"><span></span></div>
      <div class="pop">Katto!</div>
    </div>
    <div class="col-status"></div>
  </div>
</template>

<template id="adder-tpl">
  <section class="card adder">
    <div class="adder-top"><span class="dot"></span><label></label><output>30 min</output></div>
    <input type="range" min="0" step="1" value="30">
    <div class="ticks"></div>
    <div class="adder-actions">
      <button class="step" type="button" data-d="-1">−</button>
      <button class="step" type="button" data-d="1">+</button>
      <button class="add" type="button">Lisää</button>
    </div>
  </section>
</template>

<script>
(function(){
  const COUNTERS=[
    {key:'run', name:'Lenkit',cap:180,seg:30,max:120,label:'Lenkki',      ticks:['0','30 min','1 h','1,5 h','2 h'],into:'lenkkeihin'},
    {key:'lift',name:'Puntit',cap:60, seg:15,max:60, label:'Punttitreeni',ticks:['0','15','30','45','60 min'],into:'puntteihin'}
  ];
  const KEY='saldolaskuri.v1';
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- storage ---------- */
  function load(){
    const base={run:0,lift:0,redeemed:0,slider:{run:30,lift:30}};
    try{
      const s=JSON.parse(localStorage.getItem(KEY));
      if(s&&typeof s==='object'){
        return {run:+s.run||0,lift:+s.lift||0,redeemed:+s.redeemed||0,slider:Object.assign({},base.slider,s.slider||{})};
      }
    }catch(e){}
    return base;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  let state=load();

  /* ---------- helpers ---------- */
  const fmt=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
  function fmtLong(m){const h=Math.floor(m/60),mm=m%60;if(!h)return mm+' min';if(!mm)return h+' h';return h+' h '+mm+' min'}
  // Overflow above the ceiling is drawn on a compressing scale: +50 % ≈ halfway up the bonus zone, never reaching the top.
  function overFrac(bal,cap){const f=(bal-cap)/cap;return f<=0?0:f/(f+0.6)}
  const CAP_AT=0.70,OVER_ZONE=0.30;
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  /* ---------- haptics ---------- */
  // Android: Vibration API (pattern in ms: vibrate, pause, vibrate…).
  // iOS Safari 18+: clicking a hidden <input switch> gives one light tap of fixed strength.
  // Strength can't be changed on iOS, so a stronger feel = several taps in quick succession.
  //   ios: groups of taps, e.g. [3,3] = 3 quick taps, short pause, 3 quick taps
  const HAPTICS={
    light: {ios:[1],       android:30},
    add:   {ios:[3],       android:60},
    cap:   {ios:[3,3],     android:[60,70,90]},
    both:  {ios:[3,3,4],   android:[70,60,70,60,140]},
    redeem:{ios:[4,3,5],   android:[90,60,90,60,200]},
    reset: {ios:[2],       android:50}
  };
  const TAP_GAP=55;     // ms between taps inside a group
  const GROUP_GAP=170;  // ms between groups
  const hLabel=document.createElement('label'),hInput=document.createElement('input');
  hInput.type='checkbox';hInput.setAttribute('switch','');
  hLabel.appendChild(hInput);hLabel.style.display='none';hLabel.setAttribute('aria-hidden','true');
  document.body.appendChild(hLabel);
  const tap=()=>{try{hLabel.click()}catch(e){}};
  function haptic(name){
    const h=HAPTICS[name]||HAPTICS.light;
    try{ if(navigator.vibrate&&navigator.vibrate(h.android))return; }catch(e){}
    let t=0;
    h.ios.forEach(n=>{
      for(let i=0;i<n;i++){ if(t===0)tap();else setTimeout(tap,t); t+=TAP_GAP; }
      t+=GROUP_GAP-TAP_GAP;
    });
  }

  /* ---------- particles ---------- */
  const fx=document.getElementById('fx'),ctx=fx.getContext('2d');
  let parts=[],fxRaf=0,last=0,W=0,H=0;
  function sizeFx(){const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;fx.width=W*d;fx.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
  function burst(o){
    if(reduce)return;
    if(!fxRaf)sizeFx();
    for(let i=0;i<o.n;i++){
      const a=-Math.PI/2+(Math.random()-.5)*o.spread,s=o.min+Math.random()*(o.max-o.min);
      parts.push({x:o.x+(Math.random()-.5)*(o.w||0),y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        w:o.size*(.6+Math.random()*.8),h:o.size*(1+Math.random()),rot:Math.random()*6,vr:(Math.random()-.5)*.35,
        c:o.colors[i%o.colors.length],t:0,life:o.life*(.75+Math.random()*.5),g:o.g});
    }
    if(!fxRaf){last=performance.now();fxRaf=requestAnimationFrame(loop)}
  }
  function loop(t){
    const dt=Math.min(32,t-last)/16.67;last=t;
    ctx.clearRect(0,0,W,H);
    parts=parts.filter(p=>(p.t+=dt*16.67)<p.life);
    for(const p of parts){
      p.vy+=p.g*dt;p.vx*=Math.pow(.985,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      const k=p.t/p.life;
      ctx.save();ctx.globalAlpha=k<.6?1:1-(k-.6)/.4;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*1.7))+1);ctx.restore();
    }
    if(parts.length)fxRaf=requestAnimationFrame(loop);else{fxRaf=0;ctx.clearRect(0,0,W,H)}
  }

  /* ---------- build ---------- */
  const colTpl=document.getElementById('col-tpl'),adderTpl=document.getElementById('adder-tpl');
  const colsHost=document.getElementById('cols'),addersHost=document.getElementById('adders');
  const ui={};
  COUNTERS.forEach(c=>{
    const col=colTpl.content.firstElementChild.cloneNode(true);
    col.id='col-'+c.key;
    col.style.setProperty('--c','var(--'+c.key+')');col.style.setProperty('--c-soft','var(--'+c.key+'-soft)');
    col.querySelector('.zone-base').style.setProperty('--seg',(c.seg/c.cap*100)+'%');
    col.querySelector('.name').textContent=c.name;
    col.querySelector('.of').textContent='/ '+fmt(c.cap);
    col.querySelector('.ceiling span').textContent='Katto '+fmtLong(c.cap);
    colsHost.appendChild(col);

    const ad=adderTpl.content.firstElementChild.cloneNode(true);
    ad.id='adder-'+c.key;
    ad.style.setProperty('--c','var(--'+c.key+')');ad.style.setProperty('--c-soft','var(--'+c.key+'-soft)');
    const range=ad.querySelector('input');
    range.id='range-'+c.key;range.max=c.max;
    range.value=Math.min(c.max,Math.max(0,state.slider[c.key]|0));
    const lab=ad.querySelector('label');lab.textContent=c.label;lab.htmlFor=range.id;
    ad.querySelector('.ticks').innerHTML=c.ticks.map(t=>'<span>'+t+'</span>').join('');
    addersHost.appendChild(ad);

    const u={col,num:col.querySelector('.num'),bar:col.querySelector('.bar'),fillBase:col.querySelector('.fill-base'),fillOver:col.querySelector('.fill-over'),
      status:col.querySelector('.col-status'),badge:col.querySelector('.badge'),
      range,out:ad.querySelector('output'),add:ad.querySelector('.add'),shown:state[c.key],raf:0};
    ui[c.key]=u;

    let lastMark=Math.floor(range.value/15);
    range.addEventListener('input',()=>{
      syncSlider(c);
      const mark=Math.floor(range.value/15);
      if(mark!==lastMark){lastMark=mark;try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}}
    });
    range.addEventListener('change',()=>{state.slider[c.key]=+range.value;save()});
    ad.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{
      range.value=Math.min(c.max,Math.max(0,+range.value+ +b.dataset.d));
      syncSlider(c);state.slider[c.key]=+range.value;save();
      try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}
    }));
    u.add.addEventListener('click',()=>add(c));
    syncSlider(c);
  });

  function syncSlider(c){
    const u=ui[c.key],v=+u.range.value;
    u.range.style.setProperty('--pct',(v/c.max*100)+'%');
    u.out.textContent=fmtLong(v);
    u.add.textContent=v?'Lisää '+fmtLong(v):'Valitse kesto';
    u.add.setAttribute('aria-label',v?'Lisää '+fmtLong(v)+' '+c.into:'Valitse kesto');
    u.add.disabled=!v;
  }

  /* ---------- render ---------- */
  const isFull=(c,s=state)=>s[c.key]>=c.cap;
  const fullCount=(s=state)=>COUNTERS.filter(c=>isFull(c,s)).length;
  const ready=()=>fullCount()===COUNTERS.length;
  const panel=document.getElementById('panel'),banner=document.getElementById('banner');
  const redeemBtn=document.getElementById('redeem'),redeemSmall=document.getElementById('redeem-small'),redeemNote=document.getElementById('redeem-note');

  function tweenNum(c){
    const u=ui[c.key],to=state[c.key];
    cancelAnimationFrame(u.raf);
    const from=u.shown;
    if(reduce||from===to){u.shown=to;u.num.textContent=fmt(to);return}
    const t0=performance.now(),d=700;
    const step=t=>{
      const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);
      u.shown=Math.round(from+(to-from)*e);u.num.textContent=fmt(u.shown);
      if(k<1)u.raf=requestAnimationFrame(step);else u.shown=to;
    };
    u.raf=requestAnimationFrame(step);
  }
  function fillTop(c){const b=state[c.key];return Math.min(1,b/c.cap)*CAP_AT+overFrac(b,c.cap)*OVER_ZONE}

  function render(){
    COUNTERS.forEach(c=>{
      const u=ui[c.key],bal=state[c.key],full=bal>=c.cap;
      tweenNum(c);
      u.fillBase.style.height=Math.min(1,bal/c.cap)*100+'%';
      u.fillOver.style.height=overFrac(bal,c.cap)*100+'%';
      u.col.classList.toggle('full',full);
      u.badge.hidden=!full;
      u.status.innerHTML=!full?'Puuttuu '+fmtLong(c.cap-bal):bal>c.cap?'<b>+'+fmtLong(bal-c.cap)+'</b> yli katon':'<b>Katto täynnä</b>';
    });
    const r=ready();
    panel.classList.toggle('both',r);
    banner.hidden=!r;
    redeemBtn.disabled=!r;
    redeemBtn.classList.toggle('ready',r);
    redeemSmall.textContent=r?'Pidä pohjassa':'Täytä molemmat saldot';
    if(r){
      redeemNote.textContent='Lunastus vähentää katot saldoista. Katon ylittävä osa jää talteen.';
    }else{
      const miss=COUNTERS.filter(c=>!isFull(c)).map(c=>c.name.toLowerCase()+' '+fmtLong(c.cap-state[c.key]));
      redeemNote.textContent='Vielä puuttuu: '+miss.join(', ')+'.';
    }
    document.getElementById('tally').textContent=state.redeemed+'×';
  }

  function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
  function ceilingPoint(c){
    const r=ui[c.key].bar.getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.bottom-r.height*CAP_AT,w:r.width};
  }

  /* first ceiling of one counter */
  function capHit(c){
    const u=ui[c.key];
    restart(u.col,'hit');setTimeout(()=>u.col.classList.remove('hit'),1600);
    const p=ceilingPoint(c);
    burst({x:p.x,y:p.y,w:p.w*.5,n:46,spread:1.9,min:3,max:9,size:5,g:.2,life:1200,colors:[css('--'+c.key),css('--'+c.key),css('--gold')]});
  }
  /* second ceiling: both full, redeem unlocked */
  function bothHit(c){
    capHit(c);
    restart(panel,'celebrate');setTimeout(()=>panel.classList.remove('celebrate'),1400);
    restart(banner,'enter');
    restart(redeemBtn,'appear');
    COUNTERS.forEach((k,i)=>setTimeout(()=>{
      const p=ceilingPoint(k);
      burst({x:p.x,y:p.y,w:p.w*.7,n:70,spread:2.2,min:5,max:13,size:6,g:.26,life:1700,colors:[css('--run'),css('--lift'),css('--gold'),css('--gold')]});
    },250+i*120));
    setTimeout(()=>{
      const r=redeemBtn.getBoundingClientRect();
      if(r.bottom>innerHeight-70)redeemBtn.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
    },1100);
  }

  /* ---------- actions ---------- */
  const snap=()=>({run:state.run,lift:state.lift,redeemed:state.redeemed});

  function add(c){
    const u=ui[c.key],v=+u.range.value;
    if(!v)return;
    const prev=snap(),wasFull=isFull(c),prevCount=fullCount();
    state[c.key]+=v;
    save();render();
    restart(u.num,'bump');
    const chip=document.createElement('span');
    chip.className='chip';chip.textContent='+'+fmtLong(v);
    chip.style.bottom='calc('+(fillTop(c)*100)+'% + 6px)';
    u.bar.appendChild(chip);setTimeout(()=>chip.remove(),1200);

    const nowFull=!wasFull&&isFull(c);
    if(nowFull&&fullCount()===COUNTERS.length&&prevCount<COUNTERS.length){
      haptic('both');bothHit(c);
      toast('Molemmat katot täynnä!',prev);
    }else if(nowFull){
      haptic('cap');capHit(c);
      toast(c.name+': katto täynnä!',prev);
    }else{
      haptic('add');
      toast(c.name+' +'+fmtLong(v),prev);
    }
  }

  function redeem(){
    if(!ready())return;
    const prev=snap();
    COUNTERS.forEach(c=>{state[c.key]-=c.cap});
    state.redeemed++;
    save();haptic('redeem');
    const r=redeemBtn.getBoundingClientRect();
    burst({x:r.left+r.width/2,y:r.top+r.height/2,w:r.width*.7,n:170,spread:1.6,min:8,max:19,size:7,g:.32,life:2300,colors:[css('--run'),css('--lift'),css('--gold')]});
    render();
    toast('Lunastettu!',prev);
  }

  /* hold to redeem */
  // 3 s continuous hold. Fill speeds up smoothly towards the end:
  // p(x) = (e^(b·x) − 1) / (e^b − 1), b = 4.5, over a 2.3 s hold
  //   →  4 % at 0.77 s, 21 % at 1.53 s, 47 % at 1.92 s, 80 % at 2.19 s, 100 % at 2.3 s
  // Fill speed grows continuously, ending ~90× faster than it starts.
  const HOLD=2300,HOLD_B=4.5,HOLD_DEN=Math.exp(HOLD_B)-1;
  const holdCurve=x=>(Math.exp(HOLD_B*x)-1)/HOLD_DEN;
  let holdRaf=0,holdStart=0,drainRaf=0,curP=0,nextTick=0;
  function setP(p){curP=p;redeemBtn.style.setProperty('--p',p)}
  function holdBegin(e){
    if(!ready()||holdRaf)return;
    if(e&&e.preventDefault)e.preventDefault();
    cancelAnimationFrame(drainRaf);drainRaf=0;
    haptic('light');
    redeemSmall.textContent='Pidä pohjassa…';
    holdStart=performance.now();nextTick=0.25;
    const tick=t=>{
      const x=Math.min(1,(t-holdStart)/HOLD),p=holdCurve(x);
      setP(p);
      if(p>=nextTick&&nextTick<1){haptic('light');nextTick+=0.25}
      if(x>=1){holdRaf=0;setP(0);redeem();return}
      holdRaf=requestAnimationFrame(tick);
    };
    holdRaf=requestAnimationFrame(tick);
  }
  function holdEnd(){
    if(!holdRaf)return;
    cancelAnimationFrame(holdRaf);holdRaf=0;
    redeemSmall.textContent='Pidä pohjassa yhtäjaksoisesti';
    // drain back smoothly instead of snapping to zero
    const from=curP,t0=performance.now(),d=180+from*320;
    if(reduce){setP(0);return}
    const drain=t=>{
      const k=Math.min(1,(t-t0)/d);
      setP(from*(1-(1-Math.pow(1-k,3))));
      drainRaf=k<1?requestAnimationFrame(drain):0;
    };
    drainRaf=requestAnimationFrame(drain);
  }
  redeemBtn.addEventListener('pointerdown',holdBegin);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>redeemBtn.addEventListener(ev,holdEnd));
  redeemBtn.addEventListener('contextmenu',e=>e.preventDefault());
  redeemBtn.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat)holdBegin(e)});
  redeemBtn.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' ')holdEnd()});

  /* reset */
  const resetBtn=document.getElementById('reset');let resetTimer=0;
  resetBtn.addEventListener('click',()=>{
    if(!resetBtn.classList.contains('armed')){
      resetBtn.classList.add('armed');resetBtn.textContent='Paina uudelleen nollataksesi';
      resetTimer=setTimeout(disarm,3000);return;
    }
    clearTimeout(resetTimer);disarm();
    const prev=snap();
    state.run=0;state.lift=0;state.redeemed=0;save();render();haptic('reset');
    toast('Saldot nollattu',prev);
  });
  function disarm(){resetBtn.classList.remove('armed');resetBtn.textContent='Nollaa kaikki saldot'}

  /* toast + undo */
  const toastEl=document.getElementById('toast'),toastText=document.getElementById('toast-text');
  let toastTimer=0,undoSnap=null;
  function toast(msg,prev){
    toastText.textContent=msg;undoSnap=prev;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.classList.remove('show');undoSnap=null},5000);
  }
  document.getElementById('undo').addEventListener('click',()=>{
    if(!undoSnap)return;
    state.run=undoSnap.run;state.lift=undoSnap.lift;state.redeemed=undoSnap.redeemed;
    undoSnap=null;save();render();haptic('light');
    toastText.textContent='Kumottu';
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1500);
  });

  COUNTERS.forEach(c=>{ui[c.key].shown=state[c.key];ui[c.key].num.textContent=fmt(state[c.key])});
  render();
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
